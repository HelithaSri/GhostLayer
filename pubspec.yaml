name: ghostlayer
description: A macOS-only Flutter app for private overlay notes and markers
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  
  # Window management
  window_manager: ^0.3.7
  flutter_acrylic: ^1.1.3
  macos_window_utils: ^1.3.0
  
  # Global hotkeys
  hotkey_manager: ^0.2.3
  
  # UI and markdown
  markdown: ^7.1.1
  flutter_markdown: ^0.6.18
  
  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.1
  
  # Utilities
  provider: ^6.1.1
  uuid: ^4.1.0
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.7
  golden_toolkit: ^0.15.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/

# Platform-specific configuration
platforms:
  macos:
    default_package: ghost_layer